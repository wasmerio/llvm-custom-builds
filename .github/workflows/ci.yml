name: Build

on: [push]

jobs:
  build:
    name: Build

    strategy:
      matrix:
        target:
          - id: "linux-amd64"
            os: "ubuntu-22.04"
            tar_extra_args: ""
          - id: "linux-aarch64"
            os: "ubuntu-22.04-arm"
          # - id: "linux-riscv64"
          #  os: "ubuntu-latest"
          #  os: ['self-hosted', 'linux', 'RISCV64']
          - id: "darwin-amd64"
            os: "macos-15-intel"
            tar_extra_args: ""
          - id: "darwin-aarch64"
            os: "macos-latest"
            tar_extra_args: ""
            # When unpacking an archive on Windows, the symlinks can't be
            # created unless the target path already exists. This causes
            # problems when the linked file is ordered after the link
          - id: "windows-amd64"
            os: "windows-2022"
            # When unpacking an archive on Windows, the symlinks can't be
            # created unless the target path already exists. This causes
            # problems when the linked file is ordered after the link
            # inside the archive. Dereferencing the files when packing them
            # adds an additional copy per link, but it reliably works and
            # the additional size is not too large on Windows.
            tar_extra_args: "--dereference"
        llvm_version: ["23.x"]
        llvm_repo_url: ["https://github.com/llvm/llvm-project.git"]
      fail-fast: true

    runs-on: ${{ matrix.target.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Install build and compression tools on Ubuntu
        if: startsWith(matrix.target.id, 'linux-')
        shell: bash
        run: |
          sudo apt-get install ninja-build zstd -y

      - name: Install cross-compilation tools
        if: matrix.target.id == 'linux-riscv64'
        shell: bash
        run: |
          sudo apt-get install gcc-13-riscv64-linux-gnu g++-13-riscv64-linux-gnu gcc-13-multilib binutils-riscv64-linux-gnu libgcc-13-dev-riscv64-cross libstdc++6-riscv64-cross -y

      - name: Install build and compression tools on macOS
        if: startsWith(matrix.target.id, 'darwin-')
        shell: bash
        run: |
          brew install ninja zstd

      - name: Install `zstd` on Windows
        if: matrix.target.id == 'windows-amd64'
        shell: pwsh
        run: |
          choco install zstandard -y

      - name: Setup MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target.id == 'windows-amd64'

      - name: Build
        if: matrix.target.id != 'windows-amd64' && matrix.target.id != 'linux-riscv64'
        shell: bash
        run: |
          ./build.sh ${{ matrix.llvm_version }} ${{ matrix.llvm_repo_url }}

      - name: Build (linux-riscv64)
        if: matrix.target.id == 'linux-riscv64'
        shell: bash
        run: |
          ./build.sh ${{ matrix.llvm_version }} ${{ matrix.llvm_repo_url }} riscv64

      - name: Build (Windows)
        if: matrix.target.id == 'windows-amd64'
        #shell: |
        #  powershell -Command "& '{0}'"
        run: |
          ./build.ps1 ${{ matrix.llvm_version }} ${{ matrix.llvm_repo_url }}

      - name: Inspect
        shell: bash
        run: |
          PATH=llvm-project/build/destdir/bin:llvm-project/build/destdir/usr/bin:$PATH llvm-config --version
          PATH=llvm-project/build/destdir/bin:llvm-project/build/destdir/usr/bin:$PATH clang --version

      - name: Create compressed tarball
        shell: bash
        run: |
          mkdir -p dist
          tar --directory llvm-project/build/destdir --create --verbose ${{ matrix.target.tar_extra_args }} --file - . | zstd -19 -T0 -o dist/llvm.tar.zst
          ls -lh dist/llvm.tar.zst

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}-${{ matrix.llvm_version }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release

    runs-on: ubuntu-latest
    # if: startsWith(github.ref, 'refs/tags/')

    needs: [build]

    strategy:
      matrix:
        llvm_version: ["23.x"]

    steps:
      - name: Download the Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect
        shell: bash
        run: |
          ls -laGiR ./*

      - name: Prepare Upload Folder
        shell: bash
        run: |
          mkdir upload
          mv artifacts/linux-amd64-${{matrix.llvm_version}}/llvm.tar.zst upload/llvm-linux-amd64.tar.zst
          mv artifacts/linux-aarch64-${{matrix.llvm_version}}/llvm.tar.zst upload/llvm-linux-aarch64.tar.zst
          mv artifacts/darwin-amd64-${{matrix.llvm_version}}/llvm.tar.zst upload/llvm-darwin-amd64.tar.zst
          mv artifacts/darwin-aarch64-${{matrix.llvm_version}}/llvm.tar.zst upload/llvm-darwin-aarch64.tar.zst
          mv artifacts/windows-amd64-${{matrix.llvm_version}}/llvm.tar.zst upload/llvm-windows-amd64.tar.zst

          cd upload
          for archive in *.tar.zst; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ matrix.llvm_version }}
          tag_name: ${{ matrix.llvm_version }}
          files: upload/*
